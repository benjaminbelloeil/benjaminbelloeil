name: Update Galaga contribution graph

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/galaga.yml
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write

concurrency:
  group: galaga-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Galaga renderer
        run: npm install --prefix "$RUNNER_TEMP/galaga" --ignore-scripts --no-audit --no-fund --save-exact pacman-contribution-graph@5.3.1
      - name: Generate light and dark SVGs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAGA_MODULE: ${{ runner.temp }}/galaga/node_modules/pacman-contribution-graph/dist/pacman-contribution-graph.min.js
          GALAGA_OUTPUT_DIR: assets
        run: |
          node --input-type=module <<'GALAGA_SCRIPT'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          
          const username = process.env.GITHUB_USER || 'benjaminbelloeil';
          const token = process.env.GITHUB_TOKEN;
          const modulePath = process.env.GALAGA_MODULE;
          const outputDir = resolve(process.env.GALAGA_OUTPUT_DIR || 'dist');
          
          if (!token || !modulePath) {
            throw new Error('GITHUB_TOKEN and GALAGA_MODULE must be set.');
          }
          
          const { ArcadeRenderer } = await import(pathToFileURL(resolve(modulePath)).href);
          await mkdir(outputDir, { recursive: true });
          
          // Keep the contribution intensity levels distinct in a neutral grey palette.
          const greys = new Map(Object.entries({
            '#ebedf0': '#242424', '#9be9a8': '#5a5a5a', '#40c463': '#888888',
            '#30a14e': '#b6b6b6', '#216e39': '#e4e4e4',
            '#161b22': '#242424', '#0e4429': '#5a5a5a', '#006d32': '#888888',
            '#26a641': '#b6b6b6', '#39d353': '#e4e4e4',
            '#57606a': '#aaaaaa', '#8b949e': '#aaaaaa'
          }));
          
          function frameGalaga(svg) {
            if (svg.includes('id="galaga-frame"')) return svg;
            const dimensions = svg.match(/<svg\b[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"/);
            if (!dimensions) throw new Error('Cannot frame Galaga: SVG dimensions are missing.');
            const width = Number(dimensions[1]);
            const height = Number(dimensions[2]);
            const padding = 12;
            const framedWidth = width + padding * 2;
            const framedHeight = height + padding * 2;
            return `<svg xmlns="http://www.w3.org/2000/svg" id="galaga-frame" width="${framedWidth}" height="${framedHeight}" viewBox="0 0 ${framedWidth} ${framedHeight}" role="img" aria-labelledby="galaga-title">
          <title id="galaga-title">Galaga contribution animation</title>
          <defs><clipPath id="galaga-rounded-clip"><rect x="${padding}" y="${padding}" width="${width}" height="${height}" rx="10"/></clipPath></defs>
          <rect x="1.5" y="1.5" width="${framedWidth - 3}" height="${framedHeight - 3}" rx="22" fill="#202020" stroke="#6b6b6b" stroke-width="3"/>
          <g clip-path="url(#galaga-rounded-clip)"><g transform="translate(${padding} ${padding})">${svg}</g></g>
          </svg>`;
          }
          
          for (const [theme, filename] of [
            ['github', 'galaga-contribution-graph.svg'],
            ['github-dark', 'galaga-contribution-graph-dark.svg']
          ]) {
            let svg = '';
            const renderer = new ArcadeRenderer({
              game: 'galaga',
              platform: 'github',
              username,
              gameTheme: theme,
              githubSettings: { accessToken: token },
              svgCallback: (result) => { svg = result; },
              gameOverCallback: () => {},
              pointsIncreasedCallback: () => {}
            });
            await renderer.start();
            if (!svg.includes('<svg') || !svg.includes('</svg>')) {
              throw new Error(`The generator did not return an SVG for ${theme}.`);
            }
            svg = svg.replace(/#[0-9a-fA-F]{6}\b/g, (color) => greys.get(color.toLowerCase()) || color);
            if (!/<svg\b[^>]*\bviewBox=/.test(svg)) {
              const dimensions = svg.match(/<svg\b[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"/);
              if (dimensions) svg = svg.replace('<svg ', `<svg viewBox="0 0 ${dimensions[1]} ${dimensions[2]}" `);
            }
            svg = frameGalaga(svg);
            await writeFile(resolve(outputDir, filename), svg);
            console.log(`Generated ${filename} for ${username}`);
          }
          GALAGA_SCRIPT
      - name: Generate language card with logos
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python3 <<'LANGUAGE_SCRIPT'
          import base64
          import os
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          ICONS = {"Swift": "", "JavaScript": "", "TypeScript": "", "Python": "", "C#": ""}
          NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', NS)
          
          def add_language_icons(svg):
              root = ET.fromstring(svg)
              if root.tag != '{' + NS + '}svg':
                  raise ValueError('Language-card endpoint did not return an SVG')
              replaced = 0
              for group in root.iter('{' + NS + '}g'):
                  markers = [c for c in group if c.tag == '{' + NS + '}rect' and c.get('width') == '14' and c.get('height') == '14']
                  labels = [c for c in group if c.tag == '{' + NS + '}text']
                  if not markers or len(markers) != len(labels):
                      continue
                  for marker, label in zip(markers, labels):
                      name = ''.join(label.itertext())
                      logo = ICONS.get(name)
                      if logo is None:
                          # Keep new language names legible until a matching brand icon is added.
                          generic = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="#454545"/><path d="m8 7-5 5 5 5m8-10 5 5-5 5" fill="none" stroke="white" stroke-width="2"/></svg>'
                          logo = base64.b64encode(generic.encode()).decode()
                      icon = ET.Element('{' + NS + '}image', {
                          'x':'-2', 'y':str(float(marker.get('y','0'))-2),
                          'width':'18', 'height':'18',
                          'href':'data:image/svg+xml;base64,'+logo,
                          'aria-label':name+' logo'
                      })
                      group.insert(list(group).index(marker), icon)
                      group.remove(marker)
                      label.set('x','24')
                      replaced += 1
              if replaced == 0:
                  raise ValueError('No language legend found; refusing to replace the existing card')
              title = ET.Element('{' + NS + '}title')
              title.text = 'Top languages by repository count, with language logos'
              root.insert(0, title)
              root.set('role','img')
              return ET.tostring(root, encoding='unicode')
          
          if __name__ == '__main__':
              query = urllib.parse.urlencode({
                  'username':os.environ.get('GITHUB_USER','benjaminbelloeil'),
                  'theme':'graywhite', 'title_color':'F1F1F1', 'text_color':'CACACA',
                  'bg_color':'202020', 'border_color':'383838',
                  'icon_color':'AAAAAA', 'chart_color':'B8B8B8'
              })
              url = 'https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?' + query
              with urllib.request.urlopen(url, timeout=60) as response:
                  svg = response.read().decode('utf-8')
              rendered = add_language_icons(svg)
              Path('assets').mkdir(exist_ok=True)
              Path('assets/top-languages.svg').write_text(rendered)
              print('Updated language card with embedded logos')
          LANGUAGE_SCRIPT
      - name: Generate streak card with conditional color
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python3 <<'STREAK_SCRIPT'
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          NS = 'http://www.w3.org/2000/svg'
          ET.register_namespace('', NS)
          ET.register_namespace('xlink', 'http://www.w3.org/1999/xlink')
          WHITE = '#FFFFFF'
          ORANGE = '#FF9A3C'
          
          def style_streak(svg):
              root = ET.fromstring(svg)
              parents = {child: parent for parent in root.iter() for child in parent}
              def column(label):
                  labels = [node for node in root.iter('{' + NS + '}text') if ''.join(node.itertext()).strip() == label]
                  if len(labels) != 1:
                      raise ValueError('Expected one streak label: ' + label)
                  return parents[parents[labels[0]]]
              current = column('Current Streak')
              numbers = [node for node in current.iter('{' + NS + '}text') if re.fullmatch(r'[0-9,]+', ''.join(node.itertext()).strip())]
              if len(numbers) != 1:
                  raise ValueError('Cannot determine the current streak; keeping the previous card')
              value = int(''.join(numbers[0].itertext()).strip().replace(',', ''))
              color = ORANGE if value > 0 else WHITE
              for node in current.iter():
                  if node.tag == '{' + NS + '}text' and node.get('font-size') != '12px':
                      node.set('fill', color)
                  elif node.tag == '{' + NS + '}circle':
                      node.set('stroke', color)
                  elif node.tag == '{' + NS + '}path' and node.get('fill', 'none') != 'none':
                      node.set('fill', color)
              for label in ['Total Contributions', 'Longest Streak']:
                  for node in column(label).iter('{' + NS + '}text'):
                      if node.get('font-size') != '12px':
                          node.set('fill', WHITE)
              root.set('role', 'img')
              root.set('aria-label', f'Total contributions, current streak of {value} days, and longest streak')
              return ET.tostring(root, encoding='unicode')
          
          if __name__ == '__main__':
              query = urllib.parse.urlencode({
                  'user':os.environ.get('GITHUB_USER','benjaminbelloeil'),
                  'theme':'dark', 'locale':'en', 'short_numbers':'false',
                  'hide_border':'true', 'card_width':'900', 'card_height':'180',
                  'background':'202020', 'ring':'FFFFFF', 'fire':'FFFFFF',
                  'currStreakLabel':'FFFFFF', 'currStreakNum':'FFFFFF',
                  'sideLabels':'FFFFFF', 'sideNums':'FFFFFF',
                  'dates':'A0A0A0', 'stroke':'383838'
              })
              with urllib.request.urlopen('https://streak-stats.demolab.com/?' + query, timeout=60) as response:
                  svg = response.read().decode('utf-8')
              rendered = style_streak(svg)
              Path('assets').mkdir(exist_ok=True)
              Path('assets/streak.svg').write_text(rendered)
              print('Updated streak card; orange only for a positive current streak')
          STREAK_SCRIPT
      - name: Update the bundled profile images
        run: |
          git add -- assets/galaga-contribution-graph.svg assets/galaga-contribution-graph-dark.svg assets/top-languages.svg assets/streak.svg
          if git diff --cached --quiet; then
            echo "Profile images are already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Refresh profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
