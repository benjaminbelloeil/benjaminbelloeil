<svg xmlns="http://w3.org" width="100%" height="240" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
  <title id="title">About Benjamin</title>
  <desc id="desc">Software Engineer profile card with full-stack and mobile focus.</desc>
  
  <!-- Outer Window Container -->
  <rect x="0.5" y="0.5" width="799" height="239" rx="8" fill="#202020" stroke="#3d3d3d"/>
  
  <!-- File Tab Design Layout -->
  <path d="M9 1H163V35H1V9Q1 1 9 1" fill="#292929"/>
  <path d="M1 35H800" stroke="#3d3d3d"/>
  <path d="M18 1H147" stroke="#c4c4c4" stroke-width="2"/>
  
  <!-- TypeScript TSX File Icon -->
  <g transform="translate(18, 11)">
    <rect width="16" height="16" rx="2" fill="#3178c6"/>
    <text x="3" y="12" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">TS</text>
  </g>
  
  <!-- Title String -->
  <text x="40" y="23" font-family="monospace" font-size="13" fill="#d4d4d4">Engineer.tsx</text>
  
  <!-- Code Body Section -->
  <g font-family="monospace" font-size="13">
    <!-- Line 1 -->
    <text x="19" y="65" fill="#777777">1</text>
    <text x="44" y="65" fill="#bcbcbc">let <tspan fill="#f1f1f1">softwareEngineer</tspan> = FullStackAndMobileDeveloper(</text>
    
    <!-- Line 2 -->
    <text x="19" y="91" fill="#777777">2</text>
    <text x="44" y="91" fill="#f1f1f1">    coreStack<tspan fill="#bcbcbc">: "Next.js, TypeScript, React Native &amp; SwiftUI",</tspan></text>
    
    <!-- Line 3 -->
    <text x="19" y="117" fill="#777777">3</text>
    <text x="44" y="117" fill="#f1f1f1">    backendAndCloud<tspan fill="#bcbcbc">: "Node.js, PostgreSQL, Supabase &amp; AWS APIs",</tspan></text>
    
    <!-- Line 4 -->
    <text x="19" y="143" fill="#777777">4</text>
    <text x="44" y="143" fill="#f1f1f1">    testingAndCI<tspan fill="#bcbcbc">: "156 Vitest suites via GitHub Actions",</tspan></text>
    
    <!-- Line 5 -->
    <text x="19" y="169" fill="#777777">5</text>
    <text x="44" y="169" fill="#f1f1f1">    appliedAI<tspan fill="#bcbcbc">: "Claude Assistants &amp; Model Context Protocol (MCP)",</tspan></text>
    
    <!-- Line 6 -->
