    <text x="44" y="195" fill="#f1f1f1">    credentials<tspan fill="#bcbcbc">: "Tec de Monterrey (CSE) &amp; Apple Developer Academy",</tspan></text>
    
    <!-- Line 7 -->
    <text x="19" y="221" fill="#777777">7</text>
    <text x="44" y="221" fill="#bcbcbc">)</text>
