<svg xmlns="http://www.w3.org/2000/svg" style="isolation: isolate" viewBox="0 0 900 180" width="900px" height="180px" direction="ltr" role="img" aria-label="Total contributions, current streak of 1 days, and longest streak">
        <style>
            @keyframes currstreak {
                0% { font-size: 3px; opacity: 0.2; }
                80% { font-size: 34px; opacity: 1; }
                100% { font-size: 28px; opacity: 1; }
            }
            @keyframes fadein {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
        </style>
        <defs>
            <clipPath id="outer_rectangle">
                <rect width="900" height="180" rx="4.5" />
            </clipPath>
            <mask id="mask_out_ring_behind_fire">
                <rect width="900" height="180" fill="white" />
                <ellipse id="mask-ellipse" cx="450" cy="32" rx="13" ry="18" fill="black" />
            </mask>
            
        </defs>
        <g clip-path="url(#outer_rectangle)">
            <g style="isolation: isolate">
                <rect stroke="#383838" stroke-opacity="1" fill="#111111" rx="4.5" x="0.5" y="0.5" width="899" height="179" />
            </g>
            <g style="isolation: isolate">
                <line x1="300" y1="24.25" x2="300" y2="162.5" vector-effect="non-scaling-stroke" stroke-width="1" stroke="#383838" stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="3" />
                <line x1="600" y1="24.25" x2="600" y2="162.5" vector-effect="non-scaling-stroke" stroke-width="1" stroke="#383838" stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="3" />
            </g>
            <g style="isolation: isolate">
                
                <g transform="translate(150, 40.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="700" font-size="28px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 0.6s">
                        1,037
                    </text>
                </g>

                
                <g transform="translate(150, 76.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="400" font-size="14px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s">
                        Total Contributions
                    </text>
                </g>

                
                <g transform="translate(150, 106.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#a0a0a0" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="400" font-size="12px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 0.8s">
                        Sep 19, 2022 - Present
                    </text>
                </g>
            </g>
            <g style="isolation: isolate">
                
                <g transform="translate(450, 100.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FF9A3C" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="700" font-size="14px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 0.9s">
                        Current Streak
                    </text>
                </g>

                
                <g transform="translate(450, 137.5)">
                    <text x="0" y="21" stroke-width="0" text-anchor="middle" fill="#a0a0a0" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="400" font-size="12px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 0.9s">
                        Sep 21
                    </text>
                </g>

                
                <g mask="url(#mask_out_ring_behind_fire)">
                    <circle cx="450" cy="63.5" r="40" fill="none" stroke="#FF9A3C" stroke-width="5" style="opacity: 0; animation: fadein 0.5s linear forwards 0.4s" />
                </g>
                
                <g transform="translate(450, 12)" stroke-opacity="0" style="opacity: 0; animation: fadein 0.5s linear forwards 0.6s">
                    <path d="M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z" fill="none" />
                    <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#FF9A3C" stroke-opacity="0" />
                </g>

                
                <g transform="translate(450, 40.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FF9A3C" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="700" font-size="28px" font-style="normal" style="animation: currstreak 0.6s linear forwards">
                        1
                    </text>
                </g>

            </g>
            <g style="isolation: isolate">
                
                <g transform="translate(750, 40.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="700" font-size="28px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 1.2s">
                        24
                    </text>
                </g>

                
                <g transform="translate(750, 76.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#FFFFFF" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="400" font-size="14px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 1.3s">
                        Longest Streak
                    </text>
                </g>

                
                <g transform="translate(750, 106.5)">
                    <text x="0" y="32" stroke-width="0" text-anchor="middle" fill="#a0a0a0" stroke="none" font-family="&quot;Segoe UI&quot;, Ubuntu, sans-serif" font-weight="400" font-size="12px" font-style="normal" style="opacity: 0; animation: fadein 0.5s linear forwards 1.4s">
                        May 18, 2025 - Jun 10, 2025
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
